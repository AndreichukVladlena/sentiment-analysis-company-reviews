[project]
name = "sentiment-analysis-company-reviews"
version = "0.1.0"
description = "Анализ отзывов и прогноз оценки для Kaggle Company Reviews"
requires-python = ">=3.12,<3.15"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
eda = [
    "ipykernel>=7,<8",
    "matplotlib>=3.11,<4",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
]
deberta = [
    "sentencepiece>=0.2,<1",
    "torch>=2.9,<3",
    "transformers>=4.57,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
