[project]
name = "sentiment-analysis-company-reviews"
version = "0.1.0"
description = "Анализ отзывов и прогноз оценки для Kaggle Company Reviews"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
eda = [
    "ipykernel>=7,<8",
    "matplotlib>=3.11,<4",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
]

[tool.uv]
package = false
