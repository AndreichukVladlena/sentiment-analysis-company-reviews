[project]
name = "sentiment-analysis-company-reviews"
version = "0.1.0"
description = "Анализ отзывов и прогноз оценки для Kaggle Company Reviews"
requires-python = ">=3.12,<3.15"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
eda = [
    "ipykernel>=7,<8",
    "matplotlib>=3.11,<4",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
